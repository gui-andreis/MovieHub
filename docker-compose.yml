# Ambiente local: Postgres + Redis + API
#   docker compose up -d postgres redis   → só a infraestrutura (rode a API com dotnet run)
#   docker compose up --build             → tudo em containers
# Variáveis opcionais em .env (veja .env.example)
services:
  postgres:
    image: postgres:16-alpine
    container_name: MovieHubApi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: movieHubDB
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: MovieHubApi-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: MovieHubApi-Api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=movieHubDB;Username=postgres;Password=admin
      ConnectionStrings__Redis: redis:6379
      Jwt__SecretKey: ${JWT_SECRET_KEY:-dev-only-secret-change-me-in-production-0123456789}
      Admin__Email: ${ADMIN_EMAIL:-admin@moviehub.com}
      Admin__Password: ${ADMIN_PASSWORD:-Admin@123}
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      Tmdb__ReadAccessToken: ${TMDB_READ_ACCESS_TOKEN:-}
      Tmdb__SeedMovies: ${TMDB_SEED_MOVIES:-300}
      Tmdb__SeedSeries: ${TMDB_SEED_SERIES:-120}

volumes:
  postgres_data:

# Rede compartilhada com o moviehub-ai (que acessa a API por MovieHubApi-Api:8080)
networks:
  default:
    name: moviehub-network
